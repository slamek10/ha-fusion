                type: button
                entity_id: vacuum.viomi_v8_f25d_robot_cleaner
                more_info: false
                template:
                  service: |-
                    service: browser_mod.popup
                    data:
                      title: Usisavač
                      timeout: 300000
                      style: |
                        --popup-max-width: calc(385px + 495px);
                        --primary-color: transparent; /* hide timeout progress */
                      card_mod:
                        style:
                          # card divider border
                          layout-card$grid-layout$: |
                            #root {
                              margin: -24px 0 !important;
                            }
                            hui-vertical-stack-card {
                              border-right: 1.5px solid rgba(0, 0, 0, 0.2);
                              border-radius: 0;
                              transition: none;
                            }
                            /* phone */
                            @media screen and (max-width: 800px) {
                              hui-vertical-stack-card {
                                border-right: none;
                                border-bottom: 1.5px solid rgba(0, 0, 0, 0.2);
                              }
                            }
                      content:
                        type: custom:layout-card
                        layout_type: custom:grid-layout
                        layout:
                          margin: 0
                          grid-template-columns: 385px 495px
                          grid-template-rows: 1fr
                          grid-template-areas: |
                            "info map"
                          mediaquery:
                            #phone
                            "(max-width: 800px)":
                              grid-template-columns: 1fr
                              grid-template-rows: repeat(2, 1fr)
                              grid-template-areas: |
                                "info"
                                "map"
                        cards:

                          ### Detalji

                          - type: vertical-stack
                            view_layout:
                              grid-area: info
                            cards:
                            - type: entities
                              title: Stanje
                              card_mod:
                                class: header
                                style: |
                                  .card-content {
                                    padding: var(--tablet-popup-content-padding);
                                    padding-bottom: 0;
                                  }
                              entities:

                              - entity: vacuum.viomi_v8_f25d_robot_cleaner

                              - type: custom:bar-card
                                width: 55%
                                height: 2em
                                decimal: 0
                                unit_of_measurement: '%'
                                positions:
                                  icon: outside
                                  indicator: 'off'
                                  name: outside
                                severity:
                                  - color: '#303435'
                                    from: 11
                                    to: 999
                                  - color: '#6d2525'
                                    from: 0
                                    to: 10
                                entity_row: true
                                entities:
                                  - entity: vacuum.viomi_v8_f25d_robot_cleaner
                                    attribute: battery_level
                                    name: Baterija
                                    icon: mdi:battery
                                  - entity: vacuum.viomi_v8_f25d_robot_cleaner
                                    attribute: viomi_vacuum.main_brush_life
                                    name: Glavna četka
                                    icon:
                                  - entity: vacuum.viomi_v8_f25d_robot_cleaner
                                    attribute: viomi_vacuum.side_brush_life
                                    name: Sakupljač
                                    icon:
                                  - entity: vacuum.viomi_v8_f25d_robot_cleaner
                                    attribute: viomi_vacuum.mop_life
                                    name: Krpa
                                    icon:

                              - type: custom:more-info-card
                                entity: vacuum.viomi_v8_f25d_robot_cleaner
                                card_mod:
                                  style:
                                    # hide everything but ha-select
                                    .: |
                                      h1, state-card-content {
                                        display: none;
                                      }
                                      .card-content {
                                        padding: 1.5em 0 0 0.7em;
                                      }
                                    more-info-vacuum$:
                                      .: |
                                        div.flex-horizontal>div, div:nth-child(2), ha-attributes {
                                          display: none;
                                        }
                                        ha-select {
                                          display: contents;
                                        }
                                      ha-select:
                                        $:
                                          # no icon so remove label inset
                                          .: |
                                            .mdc-floating-label {
                                              inset-inline-start: 0 !important;
                                            }
                                          # fix transparent menu background color
                                          mwc-menu$: |
                                            mwc-list {
                                              background: var(--card-background-color);
                                            }

                          ### Način čišćenja

                          - type: custom:xiaomi-vacuum-map-card
                            view_layout:
                              grid-area: map
                            card_mod:
                              class: header
                              style: |
                                ha-card {
                                  --map-card-primary-color: #FFFFFF10;
                                  --map-card-secondary-color: none;
                                  --map-card-secondary-text-color: #9da0a2;
                                  --map-card-internal-big-radius: 0.6em !important;
                                }
                                div.map-wrapper, div.controls-wrapper {
                                  padding: var(--tablet-popup-content-padding);
                                  padding-top: 0;
                                  padding-bottom: 0;
                                  letter-spacing: normal;
                                }
                                div.tiles-wrapper, div.vacuum-controls, #map-zoomer-overlay {
                                  display: none;
                                }
                                div.map-controls-wrapper {
                                  padding-top: 24px;
                                }
                                paper-button {
                                  --mdc-icon-size: 2em;
                                  color: #9da0a2 !important;
                                  padding: 0.42em;
                                }        
                            entity: vacuum.viomi_v8_f25d_robot_cleaner
                            map_source:
                              camera: camera.vacuum_map
                            calibration_source:
                              camera: true
                            map_locked: true
                            vacuum_platform: send_command  
                            map_modes:

                              - template: vacuum_goto
                              - template: vacuum_clean_zone
                  state: >-
                    {% if is_state(entity_id, "on") %} Čišćenje


                    {% elif (state_attr('vacuum.viomi_v8_f25d_robot_cleaner' ,
                    'battery_level') == 100) %} Na docku


                    {% elif (state_attr('vacuum.viomi_v8_f25d_robot_cleaner' ,
                    'battery_level') < 100) %} Na punjenju


                    {% endif %}
                name: Usisavač
                col: 3
